[project]
name = "readcast"
version = "0.1.0"
description = "Turn a web article into a narrated episode in a private podcast feed."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "num2words>=0.5.13",
    "mutagen>=1.47",
    "feedgen>=1.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.9",  # form-POST submit path for the bookmarklet
    "pypdf>=5.0",               # reading PDFs
    "rich>=13.0",               # the watch dashboard
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
# The server and tts extras carry the OpenAI-compatible HTTP server and the
# tokenizers Breeze TTS 2 needs.
mlx = ["mlx-audio[server,tts]>=0.5.1", "mlx-whisper>=0.4", "misaki[en]>=0.9"]

[project.scripts]
readcast = "readcast.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/readcast"]
artifacts = ["src/readcast/web/*.html", "src/readcast/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Several test modules share fixtures via `from tests.test_pipeline import ...`,
# which needs the repo root importable.
pythonpath = ["."]
addopts = "-q"
markers = ["slow: end-to-end runs that synthesize a full article"]
